name: RM.7 Zone A Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-manifest:
    name: Canonical source boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - name: Verify package manifests remain canonical
        run: git diff --exit-code -- package.json package-lock.json
      - run: npm run verify:release-identity-boundary

  reliability-density:
    name: Reliability density
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - run: npm run test:m1.1:reliability

  built-runtime-navigation:
    name: Built runtime and navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:dms1:built-runtime
      - run: npm run test:sidebar:built-runtime

  full-static-gate:
    name: Full static gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:strict
      - run: npm test -- --no-file-parallelism --maxWorkers=1
      - run: npm run build
      - run: npm run test:dms1:built-runtime
      - run: npm run test:sidebar:built-runtime
      - run: npm run verify:release-identity-boundary
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: "dist/**"
      - name: Verify build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' subject; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY"
          done < <(find dist -type f -print0)
