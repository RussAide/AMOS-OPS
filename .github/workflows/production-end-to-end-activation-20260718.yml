name: Protected AMOS-OPS Railway Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved 40-character commit SHA to release
        required: true
        type: string
      release_id:
        description: Approved immutable Production release identifier
        required: true
        type: string
      change_reference:
        description: Eghosa-approved change-control reference
        required: true
        type: string
      confirmation:
        description: Type AUTHORIZE_EXACT_SHA_RELEASE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: amos-ops-protected-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify exact SHA and deploy Railway single surface
    environment: amos-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_ID: ${{ inputs.release_id }}
      CHANGE_REFERENCE: ${{ inputs.change_reference }}
      RAILWAY_PROJECT_ID: f9357da4-00c4-4f25-a52d-5c53f6ce07dc
      RAILWAY_SERVICE_ID: 8fdf6d7e-c7ba-412d-95f0-8b980ba612ba
      RAILWAY_ENVIRONMENT_ID: 7c22d214-abac-478f-983b-1418a7cbac77
      RAILWAY_PUBLIC_ORIGIN: https://amos-ops.com

    steps:
      - name: Validate explicit Production gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "AUTHORIZE_EXACT_SHA_RELEASE"
          test -n "$CHANGE_REFERENCE"
          test -n "$RELEASE_ID"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out the exact approved source identity
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install locked dependency graph
        run: npm ci

      - name: Run release qualification
        run: |
          npm run lint:strict
          npm run typecheck
          npm run test
          npm run build
          npm run test:dms1:built-runtime
          npm run test:sidebar:built-runtime

      - name: Seal exact release identity into frontend and backend
        run: >-
          node scripts/production-release-manifest.mjs
          --release-id "$RELEASE_ID"
          --release-sha "$RELEASE_SHA"

      - name: Assemble immutable Railway release stage
        run: >-
          node scripts/production-release-stage.mjs
          --output "$RUNNER_TEMP/amos-production-release"

      - name: Deploy exact prebuilt stage to Railway Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          npx --yes @railway/cli@5.27.0 up
          "$RUNNER_TEMP/amos-production-release"
          --path-as-root
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service "$RAILWAY_SERVICE_ID"
          --ci

      - name: Verify Production health and release identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5             "$RAILWAY_PUBLIC_ORIGIN/api/health/ready" > "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5             "$RAILWAY_PUBLIC_ORIGIN/release-manifest.json" > "$RUNNER_TEMP/live-release-manifest.json"
          test "$(jq -r '.commitSha' "$RUNNER_TEMP/live-release-manifest.json")" = "$RELEASE_SHA"
          test "$(jq -r '.releaseId' "$RUNNER_TEMP/live-release-manifest.json")" = "$RELEASE_ID"

      - name: Preserve non-secret release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-ops-railway-production-${{ inputs.release_id }}
          path: |
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/live-release-manifest.json
            dist/release-manifest.json
          if-no-files-found: ignore
          retention-days: 90
